[package]
name = "mixer"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mixer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.32.1"
groth16-solana = "0.2.0"
light-poseidon = "0.3.0"
light-hasher = "2.0.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
bytemuck = { version = "1.14", features = ["derive"] }


